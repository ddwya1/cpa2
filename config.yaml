# CLIProxyAPI configuration for blitz.cloud
# Based on the official config.example.yaml.

host: ""
port: 8317
trusted-proxies: []

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  allow-remote: true
  secret-key: "5"
  disable-control-panel: false

auth-dir: "/CLIProxyAPI/auths"

# Replace this value with your own strong API key before deployment.
api-keys:
  - "REPLACE_WITH_YOUR_OWN_LONG_RANDOM_API_KEY"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

discovery:
  enabled: false

plugins:
  enabled: false
  dir: "/CLIProxyAPI/plugins"
  configs: {}

commercial-mode: false
logging-to-file: false
logs-max-total-size-mb: 0
error-logs-max-files: 10
usage-statistics-enabled: false
redis-usage-queue-retention-seconds: 60
proxy-url: ""
force-model-prefix: false
passthrough-headers: false
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
disable-cooling: false
save-cooldown-status: false
transient-error-cooldown-seconds: 0
disable-claude-cloak-mode: false

claude:
  model-level-cooling: false

claude-code:
  disable-cloaking-model-list: false

disable-image-generation: false
video-result-auth-cache-ttl: "3h"
auth-auto-refresh-workers: 16

quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: true

routing:
  strategy: "round-robin"
  session-affinity: false
  session-affinity-ttl: "1h"
  session-affinity-subagents: true

codex:
  response-steering: false
  identity-confuse: false
  disable-codex-cloaking: false
  stream-bootstrap-buffering: false
  stream-bootstrap-timeout: "0"
  optimize-multi-agent-v2: false
  orphan-delegation-compatibility: false
  model-level-cooling: false
  live-media-relay:
    enabled: false
    max-sessions: 32
    disable-private-remote-ips: false
    public-ip: ""
    udp-port-min: 0
    udp-port-max: 0

xai:
  inject-x-search: false

ws-auth: true
nonstream-keepalive-interval: 0
